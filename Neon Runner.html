<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Runner</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  overflow: hidden;
}

canvas {
  display: block;
  margin: auto;
  background: #050505;
  border: 2px solid #00ffcc;
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 18px;
}
</style>
</head>

<body>

<div id="ui">Score: 0</div>
<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const ui = document.getElementById("ui");

let player = {
  x: 180,
  y: 520,
  w: 40,
  h: 40,
  speed: 6
};

let keys = {};
let obstacles = [];
let score = 0;
let gameOver = false;
let spawnRate = 1200;

// A / D controls
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// spawn blocks
function spawnObstacle() {
  const size = 40;
  obstacles.push({
    x: Math.random() * (canvas.width - size),
    y: -50,
    w: size,
    h: size,
    speed: 3 + Math.random() * 2
  });
}

setInterval(() => {
  if (!gameOver) spawnObstacle();
}, spawnRate);

function update() {
  if (gameOver) return;

  // A / D movement
  if (keys["a"]) player.x -= player.speed;
  if (keys["d"]) player.x += player.speed;

  // bounds
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

  // obstacles
  for (let i = 0; i < obstacles.length; i++) {
    let o = obstacles[i];
    o.y += o.speed;

    // collision
    if (
      player.x < o.x + o.w &&
      player.x + player.w > o.x &&
      player.y < o.y + o.h &&
      player.y + player.h > o.y
    ) {
      gameOver = true;
    }
  }

  obstacles = obstacles.filter(o => o.y < 650);

  score++;
  spawnRate = Math.max(400, 1200 - score / 5);

  ui.textContent = gameOver ? "💀 GAME OVER | Score: " + score : "Score: " + score;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // player
  ctx.fillStyle = "#00ffcc";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // obstacles
  ctx.fillStyle = "red";
  obstacles.forEach(o => {
    ctx.fillRect(o.x, o.y, o.w, o.h);
  });

  if (gameOver) {
    ctx.fillStyle = "white";
    ctx.font = "30px Arial";
    ctx.fillText("GAME OVER", 100, 300);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
