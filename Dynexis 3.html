<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dynexis 3 OS</title>
    <style>
        /* --- CORE VARIABLES & RESET --- */
        :root {
            --bg-color: #0f0f13;
            --taskbar-bg: rgba(20, 20, 25, 0.65);
            --window-bg: rgba(25, 25, 30, 0.85);
            --accent-color: #00e5ff; /* Cyan Neon */
            --accent-glow: 0 0 15px rgba(0, 229, 255, 0.4);
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --anim-speed: 0.25s;
        }

        * { box-sizing: border-box; user-select: none; outline: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-main); background: #000; color: var(--text-color); }

        /* --- UTILITIES --- */
        .hidden { display: none !important; }
        .glass { background: var(--window-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: var(--glass-border); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 16px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: var(--accent-color); color: #000; }
        .btn-primary { background: var(--accent-color); color: #000; font-weight: bold; }
        .btn-primary:hover { box-shadow: var(--accent-glow); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- BOOT SCREEN --- */
        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: var(--accent-color);
            transition: opacity 0.8s ease-out;
        }
        #boot-screen.fade-out { opacity: 0; pointer-events: none; }
        .boot-logo { 
            font-size: 3rem; font-weight: 800; letter-spacing: 4px; margin-bottom: 30px; 
            text-transform: uppercase; text-shadow: 0 0 20px var(--accent-color); 
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.8; transform: scale(1); }
        }
        .loader-bar { 
            width: 250px; height: 6px; background: #333; border-radius: 4px; overflow: hidden; 
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .loader-progress { 
            width: 0%; height: 100%; background: var(--accent-color); 
            box-shadow: 0 0 15px var(--accent-color); 
            transition: width 0.1s linear; 
        }

        /* --- LOGIN SCREEN --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            /* Default background, overridden by JS on login if user has one */
            background: url('https://picsum.photos/seed/dynexis_bg/1920/1080') no-repeat center center/cover;
            z-index: 8000; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        #login-screen::before { content:''; position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .login-box { position: relative; z-index: 2; width: 320px; padding: 40px; border-radius: 16px; text-align: center; transition: height 0.3s; }
        .login-input { width: 100%; padding: 12px; margin: 10px 0; background: rgba(0,0,0,0.5); border: 1px solid #444; border-radius: 6px; color: white; }
        .login-input:focus { border-color: var(--accent-color); }

        /* --- DESKTOP --- */
        #desktop { 
            width: 100%; height: 100%; position: relative; 
            /* Default background, overridden by JS */
            background: url('https://picsum.photos/seed/dynexis_bg/1920/1080') no-repeat center center/cover; 
            overflow: hidden; 
        }
        #desktop::before { content:''; position: absolute; inset: 0; background: rgba(0,0,0,0.1); pointer-events: none; }

        /* --- WINDOW SYSTEM --- */
        .window {
            position: absolute; min-width: 300px; min-height: 200px;
            display: flex; flex-direction: column; border-radius: 10px;
            transition: transform 0.15s, opacity 0.15s, width 0.2s, height 0.2s;
            overflow: hidden;
        }
        .window.minimized { opacity: 0; transform: scale(0.8) translateY(200px); pointer-events: none; }
        .window.maximized { top: 0 !important; left: 0 !important; width: 100% !important; height: calc(100% - 48px) !important; border-radius: 0; }
        
        .window-header { height: 36px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: space-between; padding: 0 10px; cursor: default; }
        .window-title { font-size: 13px; font-weight: 500; color: var(--text-muted); pointer-events: none; }
        .window-controls { display: flex; gap: 8px; }
        .win-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
        .win-close { background: #ff5f56; }
        .win-min { background: #ffbd2e; }
        .win-max { background: #27c93f; }
        
        .window-content { flex: 1; overflow: auto; position: relative; background: rgba(0,0,0,0.2); }

        /* --- TASKBAR --- */
        #taskbar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 48px;
            display: flex; align-items: center; padding: 0 10px; z-index: 5000;
            justify-content: space-between;
        }
        .taskbar-left, .taskbar-center, .taskbar-right { display: flex; align-items: center; height: 100%; gap: 8px; }
        .task-icon {
            width: 36px; height: 36px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; transition: 0.2s;
            background: rgba(255,255,255,0.05); position: relative;
        }
        .task-icon:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
        .task-icon.active { background: rgba(255,255,255,0.1); box-shadow: var(--accent-glow); border-bottom: 2px solid var(--accent-color); }
        
        #clock { font-size: 12px; padding: 0 10px; text-align: right; line-height: 1.2; }

        /* --- APP LAUNCHER --- */
        #launcher-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
            z-index: 6000; display: flex; flex-direction: column; align-items: center;
            padding-top: 80px; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        #launcher-overlay.open { opacity: 1; pointer-events: auto; }
        
        .search-bar {
            width: 500px; padding: 15px 25px; font-size: 18px; border-radius: 30px;
            border: none; background: rgba(255,255,255,0.1); color: white;
            backdrop-filter: blur(20px); margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        .search-bar:focus { background: rgba(255,255,255,0.15); box-shadow: 0 0 0 2px var(--accent-color); }

        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 20px; width: 80%; max-width: 1000px; max-height: 60vh; overflow-y: auto; padding: 20px; }
        .app-item {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            padding: 15px; border-radius: 12px; cursor: pointer; transition: 0.2s;
        }
        .app-item:hover { background: rgba(255,255,255,0.1); transform: scale(1.05); }
        .app-item-icon { width: 48px; height: 48px; border-radius: 12px; background: #333; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .app-item-name { font-size: 12px; text-align: center; }

        /* --- NOTIFICATIONS --- */
        #notification-area { position: fixed; bottom: 60px; right: 20px; z-index: 9000; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            width: 300px; padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent-color);
            background: rgba(20, 20, 25, 0.95); color: white; font-size: 13px;
            animation: slideIn 0.3s forwards; backdrop-filter: blur(10px);
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* --- APP SPECIFIC STYLES --- */
        
        /* Terminal */
        .terminal-app { font-family: 'Courier New', monospace; background: #0c0c0c; color: #0f0; padding: 10px; height: 100%; overflow-y: auto; font-size: 14px; }
        .terminal-input { background: transparent; border: none; color: #0f0; width: 80%; font-family: inherit; font-size: inherit; }
        
        /* File Manager */
        .file-manager { padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
        .file-item { display: flex; flex-direction: column; align-items: center; padding: 10px; border-radius: 5px; cursor: pointer; }
        .file-item:hover { background: rgba(255,255,255,0.1); }
        .file-icon { font-size: 32px; margin-bottom: 5px; }

        /* Store */
        .store-container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .store-card { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }

        /* HTML Maker */
        .html-maker { display: flex; flex-direction: column; height: 100%; }
        .hm-toolbar { padding: 5px; background: rgba(0,0,0,0.2); display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
        .hm-body { flex: 1; display: flex; }
        .hm-code, .hm-preview { flex: 1; height: 100%; border: none; padding: 10px; font-family: monospace; resize: none; background: rgba(0,0,0,0.3); color: white; }
        .hm-preview { background: white; color: black; }

        /* Context Menu */
        #context-menu {
            position: fixed; background: rgba(30,30,35,0.95); border: 1px solid #444;
            border-radius: 6px; width: 150px; padding: 5px 0; z-index: 9999;
            display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .ctx-item { padding: 8px 15px; font-size: 13px; cursor: pointer; color: white; }
        .ctx-item:hover { background: var(--accent-color); color: black; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

    </style>
</head>
<body>

    <!-- BOOT SCREEN -->
    <div id="boot-screen">
        <div class="boot-logo">Dynexis 3</div>
        <div class="loader-bar"><div class="loader-progress" id="boot-progress"></div></div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="hidden">
        <div class="login-box glass" id="auth-container">
            <!-- Content injected via JS -->
        </div>
    </div>

    <!-- DESKTOP -->
    <div id="desktop" class="hidden">
        <div id="window-container"></div>

        <!-- Launcher Overlay -->
        <div id="launcher-overlay" onclick="if(event.target===this) Sys.toggleLauncher()">
            <input type="text" class="search-bar" placeholder="Search apps, files, or web..." id="search-input" oninput="Sys.filterApps(this.value)">
            <div class="app-grid" id="app-grid"></div>
        </div>

        <!-- Taskbar -->
        <div id="taskbar" class="glass">
            <div class="taskbar-left">
                <div class="task-icon" onclick="Sys.toggleLauncher()" title="Launcher">❖</div>
            </div>
            <div class="taskbar-center" id="taskbar-apps">
            </div>
            <div class="taskbar-right">
                <div id="clock">12:00<br>01/01/2026</div>
            </div>
        </div>

        <!-- Notifications -->
        <div id="notification-area"></div>
        
        <!-- Context Menu -->
        <div id="context-menu">
            <div class="ctx-item" onclick="Apps.uninstallCurrent()">Uninstall</div>
        </div>
    </div>

    <script>
        /* --- VIRTUAL FILE SYSTEM --- */
        const FS = {
            init: function(username) {
                if(!Sys.state.users[username].fs) {
                    Sys.state.users[username].fs = {
                        '/home/user': [
                            { name: 'Notes.txt', type: 'file', icon: '📄', action: 'open-txt', content: 'Welcome to Dynexis 3!\n\nPress F2 to take photos.' },
                            { name: 'todo.txt', type: 'file', icon: '📝', action: 'open-txt', content: '- Use Camera\n- Check Photos' },
                            { name: 'Projects', type: 'folder', icon: '📁', path: '/home/user/Projects' },
                            { name: 'Downloads', type: 'folder', icon: '📁', path: '/home/user/Downloads' },
                            { name: 'Pictures', type: 'folder', icon: '🖼️', path: '/home/user/Pictures' }
                        ],
                        '/home/user/Projects': [
                            { name: 'website.html', type: 'file', icon: '🌐', action: 'open-code', content: '<h1>Future Website</h1>' }
                        ],
                        '/home/user/Downloads': [
                            { name: 'setup.exe', type: 'file', icon: '⚙️', action: 'none' }
                        ],
                        '/home/user/Pictures': []
                    };
                    Sys.saveUsers();
                }
            },
            getFiles: function(path) {
                const user = Sys.state.currentUser;
                const tree = Sys.state.users[user].fs;
                return tree[path] || [];
            },
            addFile: function(path, fileObj) {
                const user = Sys.state.currentUser;
                const tree = Sys.state.users[user].fs;
                if(!tree[path]) tree[path] = [];
                tree[path].push(fileObj);
                Sys.saveUsers();
                this.refreshFileManagers(path);
            },
            refreshFileManagers: function(changedPath) {
                Sys.state.openWindows.forEach(win => {
                    if(win.appId === 'files') {
                        const grid = document.querySelector(`#${win.id} .file-manager`);
                        if(grid && grid.dataset.path === changedPath) {
                            Apps.renderFiles(win.id, changedPath);
                        }
                    }
                });
            }
        };

        /* --- APPS REGISTRY & LOGIC --- */
        const Apps = {
            registry: {},
            
            register: function(id, config) {
                this.registry[id] = { id, ...config };
            },

            uninstallCurrent: function() {
                const menu = document.getElementById('context-menu');
                const appId = menu.dataset.appId;
                const coreApps = ['store', 'terminal', 'settings', 'files', 'html-maker', 'calculator', 'paint', 'music', 'camera'];
                if(coreApps.includes(appId)) return Sys.notify('System', 'Core apps cannot be uninstalled.');
                
                if(confirm('Uninstall ' + appId + '?')) {
                    Sys.state.installedApps = Sys.state.installedApps.filter(a => a !== appId);
                    Sys.state.users[Sys.state.currentUser].apps = Sys.state.installedApps;
                    localStorage.setItem('dynexis_users', JSON.stringify(Sys.state.users));
                    Sys.notify('Store', appId + ' uninstalled.');
                    const openWin = Sys.state.openWindows.find(w => w.appId === appId);
                    if(openWin) Sys.closeWindow(openWin.id);
                    Sys.renderTaskbar();
                }
            },

            loadUserApps: function(username) {
                const userData = Sys.state.users[username];
                if(!userData || !userData.createdApps) return;
                userData.createdApps.forEach(appData => {
                    if(!Apps.registry[appData.id]) {
                        appData.render = function() {
                            const blob = new Blob([appData.htmlCode], { type: 'text/html' });
                            const url = URL.createObjectURL(blob);
                            return `<iframe style="width:100%; height:100%; border:none;" src="${url}"></iframe>`;
                        };
                        Apps.register(appData.id, appData);
                    }
                });
            }
        };

        /* --- SYSTEM CORE --- */
        const Sys = {
            state: {
                booted: false,
                currentUser: null,
                users: JSON.parse(localStorage.getItem('dynexis_users')) || {},
                installedApps: [],
                openWindows: [],
                zIndex: 100,
                missionFlags: {}
            },
            defaultBackground: 'url("https://picsum.photos/seed/dynexis_bg/1920/1080") no-repeat center center/cover',
            
            init: function() {
                this.boot();
                this.updateClock();
                setInterval(() => this.updateClock(), 1000);
                document.addEventListener('keydown', (e) => this.handleShortcuts(e));
                document.addEventListener('click', () => this.hideContextMenu());
                this.renderLogin(); // Initial Render
            },

            saveUsers: function() {
                localStorage.setItem('dynexis_users', JSON.stringify(this.state.users));
            },

            boot: function() {
                let p = 0;
                const bar = document.getElementById('boot-progress');
                const screen = document.getElementById('boot-screen');
                const interval = setInterval(() => {
                    p += 2; 
                    if (p > 100) p = 100;
                    bar.style.width = p + '%';
                    if (p === 100) {
                        clearInterval(interval);
                        setTimeout(() => {
                            screen.classList.add('fade-out');
                            setTimeout(() => {
                                screen.classList.add('hidden');
                                document.getElementById('login-screen').classList.remove('hidden');
                                this.state.booted = true;
                            }, 800);
                        }, 500);
                    }
                }, 30);
            },

            renderLogin: function() {
                const container = document.getElementById('auth-container');
                container.innerHTML = `
                    <h2 style="margin-top:0; color:white;">Welcome Back</h2>
                    <input type="text" id="login-user" class="login-input" placeholder="Username">
                    <input type="password" id="login-pass" class="login-input" placeholder="Password">
                    <button class="btn btn-primary" style="width:100%" onclick="Sys.login()">Login</button>
                    <div style="margin-top:15px; font-size:12px; color:var(--text-muted);">
                        <a href="#" onclick="Sys.renderRegister()" style="color:var(--accent-color); text-decoration:none;">Create Account</a>
                    </div>
                `;
            },

            renderRegister: function() {
                const container = document.getElementById('auth-container');
                container.innerHTML = `
                    <h2 style="margin-top:0; color:white;">Create Account</h2>
                    <input type="text" id="reg-user" class="login-input" placeholder="Choose Username">
                    <input type="password" id="reg-pass" class="login-input" placeholder="Choose Password">
                    <button class="btn btn-primary" style="width:100%" onclick="Sys.doRegister()">Sign Up</button>
                    <div style="margin-top:15px; font-size:12px; color:var(--text-muted);">
                        <a href="#" onclick="Sys.renderLogin()" style="color:var(--accent-color); text-decoration:none;">Back to Login</a>
                    </div>
                `;
            },

            login: function() {
                const u = document.getElementById('login-user').value;
                const p = document.getElementById('login-pass').value;
                if(!u || !p) return this.notify('Error', 'Please enter credentials.');
                if(this.state.users[u] && this.state.users[u].pass === p) {
                    this.enterDesktop(u);
                } else if (this.state.users[u]) {
                    this.notify('Login Failed', 'Incorrect password.');
                } else {
                    this.notify('Login Failed', 'User not found.');
                }
            },

            doRegister: function() {
                const u = document.getElementById('reg-user').value;
                const p = document.getElementById('reg-pass').value;
                if(!u || !p) return this.notify('Error', 'Please fill all fields.');
                if(this.state.users[u]) return this.notify('Error', 'Username already taken.');
                
                this.register(u, p);
                this.notify('Success', 'Account created! Please login.');
                this.renderLogin();
            },

            register: function(u, p) {
                this.state.users[u] = { 
                    pass: p, 
                    apps: ['terminal', 'files', 'store', 'browser', 'html-maker', 'settings', 'ai', 'camera'], 
                    missions: {}, 
                    createdApps: [],
                    background: this.defaultBackground // NEW: Store user background
                };
                this.saveUsers();
            },

            enterDesktop: function(username) {
                this.state.currentUser = username;
                this.state.installedApps = this.state.users[username].apps || [];
                this.state.missionFlags = this.state.users[username].missions || {};
                
                // NEW: Apply user background
                const bg = this.state.users[username].background || this.defaultBackground;
                document.getElementById('desktop').style.background = bg;
                document.getElementById('login-screen').style.background = bg; // Also update login screen for continuity
                
                FS.init(username);
                Apps.loadUserApps(username);
                
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('desktop').classList.remove('hidden');
                
                this.renderLauncher();
                this.notify('Dynexis 3', `Welcome, ${username}. System ready.`);
                
                if(!this.state.missionFlags.welcome_done) {
                    setTimeout(() => this.notify('Mission', 'Open Terminal and type "help" to start.'), 2000);
                }
            },

            logout: function() { location.reload(); },

            updateClock: function() {
                const now = new Date();
                document.getElementById('clock').innerHTML = 
                    now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + '<br>' + 
                    now.toLocaleDateString();
            },
            
            // NEW: Background Management
            handleBackgroundUpload: function(input) {
                if(input.files && input.files[0]) {
                    const file = input.files[0];
                    const reader = new FileReader();
                    
                    reader.onload = function(e) {
                        const dataUrl = e.target.result;
                        try {
                            const newBg = `url("${dataUrl}") no-repeat center center/cover`;
                            Sys.state.users[Sys.state.currentUser].background = newBg;
                            Sys.saveUsers();
                            
                            // Apply immediately
                            document.getElementById('desktop').style.background = newBg;
                            document.getElementById('login-screen').style.background = newBg;
                            
                            Sys.notify('Settings', 'Background updated successfully!');
                        } catch(err) {
                            console.error(err);
                            Sys.notify('Error', 'Image is too large for local storage.');
                        }
                    }
                    
                    reader.readAsDataURL(file);
                }
            },
            
            resetBackground: function() {
                Sys.state.users[Sys.state.currentUser].background = Sys.defaultBackground;
                Sys.saveUsers();
                document.getElementById('desktop').style.background = Sys.defaultBackground;
                document.getElementById('login-screen').style.background = Sys.defaultBackground;
                Sys.notify('Settings', 'Background reset to default.');
            },

            /* --- WINDOW MANAGER --- */
            openWindow: function(appId) {
                const appDef = Apps.registry[appId];
                if(!appDef) return;
                const existing = this.state.openWindows.find(w => w.id === appId);
                if(existing) {
                    this.focusWindow(appId);
                    if(existing.minimized) this.toggleMinimize(appId);
                    return;
                }

                const winId = appId + '-' + Date.now();
                const winEl = document.createElement('div');
                winEl.className = 'window glass';
                winEl.id = winId;
                winEl.style.width = appDef.width || '600px';
                winEl.style.height = appDef.height || '400px';
                winEl.style.top = (50 + (this.state.openWindows.length * 20)) + 'px';
                winEl.style.left = (50 + (this.state.openWindows.length * 20)) + 'px';
                winEl.style.zIndex = ++this.state.zIndex;

                winEl.innerHTML = `
                    <div class="window-header" onmousedown="Sys.startDrag(event, '${winId}')">
                        <span class="window-title">${appDef.name}</span>
                        <div class="window-controls">
                            <button class="win-btn win-min" onclick="Sys.toggleMinimize('${winId}')"></button>
                            <button class="win-btn win-max" onclick="Sys.toggleMaximize('${winId}')"></button>
                            <button class="win-btn win-close" onclick="Sys.closeWindow('${winId}')"></button>
                        </div>
                    </div>
                    <div class="window-content" id="content-${winId}"></div>
                `;
                winEl.onmousedown = () => this.focusWindow(winId);
                document.getElementById('window-container').appendChild(winEl);
                
                let contentHTML = typeof appDef.render === 'function' ? appDef.render() : appDef.render;
                document.getElementById('content-' + winId).innerHTML = contentHTML;
                
                this.state.openWindows.push({ id: winId, appId: appId, el: winEl, minimized: false });
                this.renderTaskbar();
                this.focusWindow(winId);
                
                if(appDef.init) appDef.init(winId);
            },

            closeWindow: function(winId) {
                const winEl = document.getElementById(winId);
                if(winEl) {
                    winEl.style.opacity = '0';
                    winEl.style.transform = 'scale(0.9)';
                    setTimeout(() => winEl.remove(), 200);
                }
                this.state.openWindows = this.state.openWindows.filter(w => w.id !== winId);
                this.renderTaskbar();
            },

            focusWindow: function(winId) {
                const win = this.state.openWindows.find(w => w.id === winId);
                if(win) {
                    win.el.style.zIndex = ++this.state.zIndex;
                    this.renderTaskbar();
                }
            },

            toggleMinimize: function(winId) {
                const win = this.state.openWindows.find(w => w.id === winId);
                if(win) {
                    win.minimized = !win.minimized;
                    win.el.classList.toggle('minimized', win.minimized);
                    this.renderTaskbar();
                }
            },

            toggleMaximize: function(winId) {
                const winEl = document.getElementById(winId);
                winEl.classList.toggle('maximized');
            },

            startDrag: function(e, winId) {
                if(e.target.closest('.window-controls')) return;
                const winEl = document.getElementById(winId);
                let shiftX = e.clientX - winEl.getBoundingClientRect().left;
                let shiftY = e.clientY - winEl.getBoundingClientRect().top;
                function moveAt(pageX, pageY) {
                    winEl.style.left = pageX - shiftX + 'px';
                    winEl.style.top = pageY - shiftY + 'px';
                    winEl.classList.remove('maximized');
                }
                function onMouseMove(event) { moveAt(event.pageX, event.pageY); }
                document.addEventListener('mousemove', onMouseMove);
                document.onmouseup = function() {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.onmouseup = null;
                };
            },

            /* --- UI ELEMENTS --- */
            renderTaskbar: function() {
                const bar = document.getElementById('taskbar-apps');
                bar.innerHTML = '';
                this.state.openWindows.forEach(win => {
                    const appDef = Apps.registry[win.appId];
                    const icon = document.createElement('div');
                    icon.className = `task-icon ${win.id === this.getTopWindowId() ? 'active' : ''}`;
                    icon.innerHTML = appDef.icon;
                    icon.title = appDef.name;
                    icon.onclick = () => {
                        if(win.minimized) this.toggleMinimize(win.id);
                        else if(win.id === this.getTopWindowId()) this.toggleMinimize(win.id);
                        else this.focusWindow(win.id);
                    };
                    icon.oncontextmenu = (e) => {
                        e.preventDefault();
                        this.showContextMenu(e, win.appId);
                    };
                    bar.appendChild(icon);
                });
            },

            getTopWindowId: function() {
                let top = null; let maxZ = 0;
                this.state.openWindows.forEach(w => {
                    const z = parseInt(w.el.style.zIndex);
                    if(z > maxZ) { maxZ = z; top = w.id; }
                });
                return top;
            },

            toggleLauncher: function() {
                const el = document.getElementById('launcher-overlay');
                el.classList.toggle('open');
                if(el.classList.contains('open')) {
                    document.getElementById('search-input').focus();
                    this.renderLauncher();
                }
            },

            renderLauncher: function(filter = '') {
                const grid = document.getElementById('app-grid');
                grid.innerHTML = '';
                Object.values(Apps.registry).forEach(app => {
                    if(filter && !app.name.toLowerCase().includes(filter.toLowerCase())) return;
                    if(!this.state.installedApps.includes(app.id) && app.id !== 'store') return;
                    const item = document.createElement('div');
                    item.className = 'app-item';
                    item.innerHTML = `
                        <div class="app-item-icon" style="color:${app.color}">${app.icon}</div>
                        <div class="app-item-name">${app.name}</div>
                    `;
                    item.onclick = () => {
                        this.toggleLauncher();
                        this.openWindow(app.id);
                    };
                    grid.appendChild(item);
                });
            },

            filterApps: function(val) { this.renderLauncher(val); },

            notify: function(title, msg) {
                const area = document.getElementById('notification-area');
                const toast = document.createElement('div');
                toast.className = 'toast glass';
                toast.innerHTML = `<strong>${title}</strong><br>${msg}`;
                area.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300);
                }, 4000);
            },

            showContextMenu: function(e, appId) {
                const menu = document.getElementById('context-menu');
                menu.style.display = 'block';
                menu.style.left = e.pageX + 'px';
                menu.style.top = e.pageY + 'px';
                menu.dataset.appId = appId;
            },

            hideContextMenu: function() { document.getElementById('context-menu').style.display = 'none'; },

            handleShortcuts: function(e) {
                if(e.key === 'F2') {
                    e.preventDefault();
                    Apps.triggerCamera();
                }
                if(e.key === 'Escape') document.getElementById('launcher-overlay').classList.remove('open');
                if(e.altKey && e.key === 'Tab') {
                    e.preventDefault();
                    if(this.state.openWindows.length < 2) return;
                    const topId = this.getTopWindowId();
                    const idx = this.state.openWindows.findIndex(w => w.id === topId);
                    const next = this.state.openWindows[(idx + 1) % this.state.openWindows.length];
                    this.focusWindow(next.id);
                }
            }
        };

        Apps.register('paint', {
            name: 'Paint Pro', icon: '🎨', color: 'orange', width: '700px', height: '550px',
            render: () => `<div style="display:flex; flex-direction:column; height:100%;"><div style="padding:8px; background:rgba(0,0,0,0.3); display:flex; gap:8px; align-items:center;"><div onclick="Apps.setPaintColor('#000000', this)" class="paint-swatch" style="width:20px; height:20px; background:black; border-radius:50%; cursor:pointer; border:2px solid white;"></div><div onclick="Apps.setPaintColor('#ff0000', this)" class="paint-swatch" style="width:20px; height:20px; background:red; border-radius:50%; cursor:pointer;"></div><div onclick="Apps.setPaintColor('#00ff00', this)" class="paint-swatch" style="width:20px; height:20px; background:green; border-radius:50%; cursor:pointer;"></div><div onclick="Apps.setPaintColor('#0000ff', this)" class="paint-swatch" style="width:20px; height:20px; background:blue; border-radius:50%; cursor:pointer;"></div><div style="flex:1"></div><button class="btn" onclick="Apps.clearPaint()">Clear</button></div><div style="flex:1; background:white; position:relative; overflow:hidden;"><canvas id="paint-canvas" style="cursor:crosshair; display:block;"></canvas></div></div>`,
            init: function(winId) { setTimeout(() => Apps.initPaint(winId), 100); }
        });
        Apps.paintColor = '#000000'; Apps.isPainting = false;
        Apps.initPaint = function(winId) {
            const winEl = document.getElementById(winId); const canvas = winEl.querySelector('#paint-canvas'); const parent = canvas.parentElement;
            canvas.width = parent.clientWidth; canvas.height = parent.clientHeight; const ctx = canvas.getContext('2d');
            ctx.lineCap = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = Apps.paintColor;
            const getPos = (e) => { const rect = canvas.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; };
            canvas.onmousedown = (e) => { Apps.isPainting = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); };
            canvas.onmousemove = (e) => { if(!Apps.isPainting) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); };
            canvas.onmouseup = () => { Apps.isPainting = false; };
        };
        Apps.setPaintColor = function(color, el) {
            Apps.paintColor = color; document.querySelectorAll('.paint-swatch').forEach(d => d.style.border = 'none');
            if(el) el.style.border = '2px solid white';
            const activeWin = Sys.getTopWindowId(); const canvas = document.querySelector(`#${activeWin} #paint-canvas`);
            if(canvas) canvas.getContext('2d').strokeStyle = color;
        };
        Apps.clearPaint = function() {
            const activeWin = Sys.getTopWindowId(); const canvas = document.querySelector(`#${activeWin} #paint-canvas`);
            if(canvas) { const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, canvas.width, canvas.height); }
        };

        // MUSIC
        Apps.register('music', {
            name: 'Music Player', icon: '🎵', color: 'purple', width: '350px', height: '450px',
            render: () => `<div style="padding:20px; text-align:center; display:flex; flex-direction:column; height:100%; background:linear-gradient(180deg, #2a0e36, #000);"><div style="width:150px; height:150px; background:#333; margin:20px auto; border-radius:10px; display:flex; align-items:center; justify-content:center;"><span style="font-size:60px;">🎵</span></div><h3 style="margin:0; color:white;">Cyberpunk Beats</h3><div style="background:rgba(255,255,255,0.1); height:4px; width:100%; border-radius:2px; margin:20px 0; overflow:hidden;"><div id="music-bar" style="width:0%; height:100%; background:#e91e63; transition:width 0.2s linear;"></div></div><div style="display:flex; justify-content:center; gap:20px; margin-top:auto;"><button class="btn" style="font-size:20px;">⏮</button><button id="play-btn" class="btn btn-primary" style="font-size:24px; padding:10px 25px; border-radius:50%;" onclick="Apps.toggleMusic(this)">▶</button><button class="btn" style="font-size:20px;">⏭</button></div></div>`
        });
        Apps.musicInterval = null;
        Apps.toggleMusic = function(btn) {
            if(Apps.musicInterval) { clearInterval(Apps.musicInterval); Apps.musicInterval = null; btn.innerHTML = '▶'; document.getElementById('music-bar').style.width = '0%'; }
            else {
                btn.innerHTML = '⏸'; let width = 0;
                Apps.musicInterval = setInterval(() => { width += 1; if(width > 100) width = 0; const bar = document.getElementById('music-bar'); if(bar) bar.style.width = width + '%'; }, 100);
            }
        };

        // CAMERA
        Apps.register('camera', {
            name: 'Camera', icon: '📷', color: 'red', width: '500px', height: '400px',
            render: function() {
                return `
                    <div style="height:100%; display:flex; flex-direction:column; background:black; position:relative;">
                        <div style="flex:1; position:relative; overflow:hidden;" id="cam-view-container">
                            <video id="cam-feed" autoplay playsinline style="width:100%; height:100%; object-fit:cover; display:block;"></video>
                            <canvas id="cam-simulation" style="width:100%; height:100%; object-fit:cover; display:none;"></canvas>
                        </div>
                        <div style="position:absolute; bottom:20px; left:0; width:100%; text-align:center;">
                            <button class="btn btn-primary" style="padding:10px 30px; border-radius:30px; background:white; color:black; font-weight:bold; font-size:16px;" onmousedown="Apps.takePhoto()" ontouchstart="Apps.takePhoto()">📷 Take Photo</button>
                        </div>
                    </div>
                `;
            },
            init: function(winId) {
                Apps.initCamera(winId);
            }
        });

        Apps.cameraSimulationInterval = null;
        
        Apps.initCamera = function(winId) {
            const video = document.querySelector(`#${winId} #cam-feed`);
            const simCanvas = document.querySelector(`#${winId} #cam-simulation`);
            const simCtx = simCanvas ? simCanvas.getContext('2d') : null;

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                    video.srcObject = stream;
                    video.style.display = 'block';
                    simCanvas.style.display = 'none';
                    if(Apps.cameraSimulationInterval) clearInterval(Apps.cameraSimulationInterval);
                }).catch(err => {
                    console.warn("Camera access denied. Switching to simulation.");
                    Apps.startCameraSimulation(winId, simCanvas, simCtx);
                });
            } else {
                Apps.startCameraSimulation(winId, simCanvas, simCtx);
            }
        };

        Apps.startCameraSimulation = function(winId, canvas, ctx) {
            const video = document.querySelector(`#${winId} #cam-feed`);
            const container = document.querySelector(`#${winId} #cam-view-container`);
            
            if(!container) return;

            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            video.style.display = 'none';
            canvas.style.display = 'block';

            Sys.notify('Camera', 'Camera unavailable. Using Simulation Mode.');

            let offset = 0;
            
            if(Apps.cameraSimulationInterval) clearInterval(Apps.cameraSimulationInterval);

            Apps.cameraSimulationInterval = setInterval(() => {
                if(!canvas.offsetParent) {
                    clearInterval(Apps.cameraSimulationInterval);
                    return;
                }
                
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 1;
                ctx.globalAlpha = 0.2;
                const gridSize = 40;
                
                offset = (offset + 1) % gridSize;
                
                for(let x = 0; x < canvas.width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                for(let y = offset; y < canvas.height; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }

                ctx.globalAlpha = 1.0;
                ctx.fillStyle = 'rgba(0, 255, 0, 0.5)';
                const scanY = (Date.now() / 5) % canvas.height;
                ctx.fillRect(0, scanY, canvas.width, 4);

                ctx.fillStyle = '#00ff00';
                ctx.font = '20px monospace';
                ctx.fillText("SIMULATION MODE", 20, 40);
                ctx.font = '14px monospace';
                ctx.fillText(new Date().toLocaleTimeString(), 20, 60);

            }, 30);
        };

        Apps.playShutterSound = function() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e) { console.log('Audio not supported'); }
        };

        Apps.takePhoto = function() {
            const activeWinId = Sys.getTopWindowId();
            const win = Sys.state.openWindows.find(w => w.id === activeWinId && w.appId === 'camera');
            if(!win) return;
            
            const video = document.querySelector(`#${activeWinId} #cam-feed`);
            const simCanvas = document.querySelector(`#${activeWinId} #cam-simulation`);
            
            let sourceElement;
            if(video.style.display !== 'none') {
                sourceElement = video;
            } else {
                sourceElement = simCanvas;
            }

            if(!sourceElement) return;

            Apps.playShutterSound();

            const captureCanvas = document.createElement('canvas');
            if(sourceElement.tagName === 'VIDEO') {
                captureCanvas.width = sourceElement.videoWidth || 640;
                captureCanvas.height = sourceElement.videoHeight || 480;
            } else {
                captureCanvas.width = sourceElement.width;
                captureCanvas.height = sourceElement.height;
            }
            
            const ctx = captureCanvas.getContext('2d');
            
            if(sourceElement.tagName === 'VIDEO') {
                ctx.drawImage(sourceElement, 0, 0, captureCanvas.width, captureCanvas.height);
            } else {
                ctx.drawImage(sourceElement, 0, 0);
            }
            
            const dataUrl = captureCanvas.toDataURL('image/png');

            const picsPath = '/home/user/Pictures';
            const existingPhotos = FS.getFiles(picsPath);
            const nextNum = existingPhotos.length + 1;
            const fileName = `photo_${nextNum}.png`;

            const newFile = {
                name: fileName,
                type: 'file',
                icon: '🖼️',
                action: 'open-img',
                content: dataUrl
            };

            FS.addFile(picsPath, newFile);
            Sys.notify('Camera', `Photo saved to Pictures`);
        };

        Apps.triggerCamera = function() {
            const camWin = Sys.state.openWindows.find(w => w.appId === 'camera');
            if(camWin) {
                Sys.focusWindow(camWin.id);
                if(camWin.minimized) Sys.toggleMinimize(camWin.id);
                setTimeout(() => Apps.takePhoto(), 100);
            } else {
                Sys.openWindow('camera');
                setTimeout(() => Apps.takePhoto(), 1000);
            }
        };

        // Initialize System
        Sys.init();
    </script>
</body>
</html>
